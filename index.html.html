<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootBlox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #111; color: white; }
    header { background: #e10600; padding: 18px; text-align: center; }
    header h1 { font-size: 28px; letter-spacing: 2px; }
    .intro { text-align: center; padding: 35px 18px 10px; }
    .intro p { color: #bbb; margin-top: 10px; line-height: 1.8; }
    .section-title { text-align: center; margin: 28px 0 8px; }
    .products { padding: 20px; display: flex; justify-content: center; align-items: stretch; gap: 20px; flex-wrap: wrap; }
    .card { display: block; background: #1e1e1e; border-radius: 12px; overflow: hidden; width: 220px; text-align: center; text-decoration: none; color: white; transition: transform .2s, box-shadow .2s; }
    .card:active { transform: scale(.96); }
    .card:hover { box-shadow: 0 0 15px #e10600; }
    .card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .farm-art { height: 220px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg,#315c36,#17251b); font-size: 75px; }
    .card p { padding: 12px; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <h1>LootBlox</h1>
  </header>

  <main>
    <section class="intro">
      <h2>متجرك للأشياء النادرة في Roblox</h2>
      <p>اختر الماب وتصفح اللوحات والأغراض النادرة المتاحة.</p>
    </section>

    <h2 class="section-title">أقسام المتجر</h2>
    <section class="products">
      <!-- صورة صيد الضبان الأصلية محفوظة كما هي -->
      <a class="card" href="dhabaan.html">
        <img src="image.jpg" alt="قسم صيد الضبان">
        <p>صيد الضبان</p>
      </a>

      <a class="card" href="farm.html">
      <img src="farm.jpg" alt="ماب المزرعة"
        <p>المزرعة</p>
      </a>
    </section>
  </main>
</body>
</html>
