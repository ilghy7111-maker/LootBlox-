<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قسم صيد الضبان | LootBlox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    header {
      background: #e10600;
      padding: 18px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }
    .title {
      text-align: center;
      padding: 25px 20px 10px;
      font-size: 24px;
    }
    .products {
      padding: 20px;
      display: flex;
      justify-content: flex-start;
      gap: 16px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      width: 260px;
      text-align: center;
    }
    .card .img-box {
      background: #2a2a2a;
      padding: 20px 10px;
    }
    .card img {
      width: 100%;
      display: block;
    }
    .card h3 {
      padding: 12px 10px 4px;
      font-size: 18px;
    }
    .card .price {
      color: #ff4d4d;
      font-size: 20px;
      font-weight: bold;
      padding-bottom: 12px;
    }
    .card .buy {
      display: block;
      margin: 0 14px 16px;
      padding: 12px;
      background: #e10600;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
    .card .buy:active {
      transform: scale(0.96);
    }
    .back {
      display: block;
      width: 160px;
      margin: 20px auto;
      padding: 12px;
      background: #333;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LootBlox</h1>
  </header>

  <h2 class="title">قسم صيد الضبان</h2>

  <section class="products">
    <div class="card">
      <div class="img-box">
        <img src="plate.svg" alt="لوحة ح ر ب ٧٢٢٢">
      </div>
      <h3> لوحة تعتبر نادرة</h3>
      <p class="price">100 Robox</p>
      <a class="buy" href="https://wa.me/966500000000">اطلب الحين</a>
    </div>
  </section>

  <a class="back" href="index.html">← رجوع للرئيسية</a>
</body>
</html
