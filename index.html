<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootBlox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }
    header {
      background: #e10600;
      padding: 18px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }
    .products {
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      display: block;
      background: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      width: 220px;
      text-align: center;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:active {
      transform: scale(0.96);
    }
    .card:hover {
      box-shadow: 0 0 15px #e10600;
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .card p {
      padding: 12px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>LootBlox</h1>
  </header>

  <section class="products">
    <a class="card" href="dhabaan.html">
      <img src="image.jpg" alt="صيد الضبان">
      <p>صيد الضبان</p>
    </a>
  </section>
</body>
</html>
